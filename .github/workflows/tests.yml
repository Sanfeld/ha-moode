name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  client:
    name: moOde client (simulated box)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest -q -p no:cacheprovider -o asyncio_mode=strict tests/client

  homeassistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q tests/ha
