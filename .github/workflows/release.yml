name: Release

# Creates the GitHub release (and its tag) automatically when the version in
# manifest.json changes on main. Release notes come from CHANGELOG.md.
on:
  push:
    branches: [main]
    paths: ["custom_components/moode/manifest.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(jq -r .version custom_components/moode/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.v.outputs.version }} already exists"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.exists.outputs.skip != 'true'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## " v { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      - name: Create release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.v.outputs.version }}" \
            --notes-file notes.md
